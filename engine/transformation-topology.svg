<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="420" viewBox="0 0 960 420"
     xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <!-- Background -->
  <rect x="0" y="0" width="960" height="420" fill="#0b1020"/>
  <rect x="20" y="20" width="920" height="380" rx="12" ry="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="60" fill="#e5e7eb" font-size="22" font-weight="600">
    RTT/3 — Transformation Topology
  </text>
  <text x="40" y="84" fill="#9ca3af" font-size="13">
    RTT/2 gpu-stack → RTT/3 topology → RTT/12
  </text>

  <!-- Lane labels -->
  <text x="60" y="130" fill="#9ca3af" font-size="12">Input</text>
  <text x="60" y="210" fill="#9ca3af" font-size="12">RTT/3 Operators</text>
  <text x="60" y="310" fill="#9ca3af" font-size="12">Output</text>

  <!-- Input: RTT/2 gpu-stack -->
  <rect x="140" y="110" width="180" height="60" rx="8" ry="8" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
  <text x="150" y="132" fill="#e5e7eb" font-size="13" font-weight="600">RTT/2 gpu-stack</text>
  <text x="150" y="150" fill="#9ca3af" font-size="11">regimeView · driftView · coherenceView</text>

  <!-- Operators row -->
  <!-- topology-map -->
  <rect x="140" y="190" width="140" height="60" rx="8" ry="8" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="212" fill="#e5e7eb" font-size="13" font-weight="600">topology-map</text>
  <text x="150" y="230" fill="#9ca3af" font-size="11">structural topology</text>

  <!-- topology-scan -->
  <rect x="310" y="190" width="140" height="60" rx="8" ry="8" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="212" fill="#e5e7eb" font-size="13" font-weight="600">topology-scan</text>
  <text x="320" y="230" fill="#9ca3af" font-size="11">regime intersections</text>

  <!-- topology-geometry -->
  <rect x="480" y="190" width="160" height="60" rx="8" ry="8" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="212" fill="#e5e7eb" font-size="13" font-weight="600">topology-geometry</text>
  <text x="490" y="230" fill="#9ca3af" font-size="11">coherence surfaces</text>

  <!-- gpu-topology -->
  <rect x="670" y="190" width="160" height="60" rx="8" ry="8" fill="#111827" stroke="#22c55e" stroke-width="1.5"/>
  <text x="680" y="212" fill="#e5e7eb" font-size="13" font-weight="600">gpu-topology</text>
  <text x="680" y="230" fill="#9ca3af" font-size="11">GPU surfaces · overlays</text>

  <!-- Synthesis: next-step -->
  <rect x="360" y="270" width="240" height="70" rx="10" ry="10" fill="#111827" stroke="#f97316" stroke-width="1.8"/>
  <text x="372" y="292" fill="#e5e7eb" font-size="14" font-weight="600">next-step (synthesis)</text>
  <text x="372" y="310" fill="#9ca3af" font-size="11">merge map · scan · geometry · gpu-topology</text>
  <text x="372" y="326" fill="#9ca3af" font-size="11">→ unified RTT/3 topology</text>

  <!-- Output: RTT/3 topology -->
  <rect x="650" y="290" width="220" height="70" rx="10" ry="10" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
  <text x="662" y="312" fill="#e5e7eb" font-size="13" font-weight="600">RTT/3 topology</text>
  <text x="662" y="330" fill="#9ca3af" font-size="11">surfaces · intersections · overlays</text>
  <text x="662" y="346" fill="#9ca3af" font-size="11">consumed by RTT/12</text>

  <!-- Arrows: input → operators -->
  <line x1="230" y1="170" x2="210" y2="190" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="210,190 214,182 206,182" fill="#6b7280"/>

  <line x1="230" y1="170" x2="280" y2="190" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="280,190 284,182 276,182" fill="#6b7280"/>

  <line x1="230" y1="170" x2="450" y2="190" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="450,190 454,182 446,182" fill="#6b7280"/>

  <line x1="230" y1="170" x2="750" y2="190" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="750,190 754,182 746,182" fill="#6b7280"/>

  <!-- Arrows: operators → synthesis -->
  <line x1="210" y1="250" x2="380" y2="270" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="380,270 384,262 376,262" fill="#6b7280"/>

  <line x1="380" y1="250" x2="420" y2="270" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="420,270 424,262 416,262" fill="#6b7280"/>

  <line x1="560" y1="250" x2="480" y2="270" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="480,270 484,262 476,262" fill="#6b7280"/>

  <line x1="750" y1="250" x2="580" y2="270" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="580,270 584,262 576,262" fill="#6b7280"/>

  <!-- Arrow: synthesis → output -->
  <line x1="600" y1="305" x2="650" y2="315" stroke="#f97316" stroke-width="1.4"/>
  <polygon points="650,315 644,309 644,321" fill="#f97316"/>

  <!-- Legend -->
  <rect x="720" y="80" width="200" height="80" rx="8" ry="8" fill="#0b1120" stroke="#1f2937" stroke-width="1.2"/>
  <text x="732" y="100" fill="#e5e7eb" font-size="12" font-weight="600">Legend</text>
  <circle cx="736" cy="118" r="5" fill="#2563eb"/>
  <text x="748" y="122" fill="#9ca3af" font-size="11">RTT/3 topology operators</text>
  <circle cx="736" cy="136" r="5" fill="#22c55e"/>
  <text x="748" y="140" fill="#9ca3af" font-size="11">GPU topology</text>
  <circle cx="736" cy="154" r="5" fill="#f97316"/>
  <text x="748" y="158" fill="#9ca3af" font-size="11">Next-step synthesis</text>

</svg>

